[package]
name = "rcat-voice"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "io-std", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "tracing-log"] }
async-trait = "0.1"
crossbeam-queue = "0.3"
rand_core = { version = "=0.10.0-rc-2", default-features = false }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
cpal = { version = "0.15.3", optional = true }
smart-turn-rs = { package = "smart-turn-rs", git = "https://github.com/miuda-ai/smart-turn-rs", rev = "92c3fca4d9ef690d142ccaf5193e6469b3517979", optional = true }
ort = { version = "2.0.0-rc.10", optional = true }

# Optional: GPT-SoVITS (Windows + CUDA) backend
# Pin to the commit that updates `tch` to support libtorch 2.9.
gpt_sovits_rs = { git = "https://github.com/second-state/gpt_sovits_rs", rev = "198a07f9dd8e440d186c8e097b79f0c74c46b5df", optional = true }
rodio = { version = "0.21.1", optional = true }
wav_io = { version = "0.1.14", optional = true }
jieba-rs = { version = "0.8", optional = true }
# Optional: GPT-SoVITS ONNX (CPU) backend
gpt_sovits_onnx_rs = { package = "gpt-sovits-onnx-rs", git = "https://github.com/null-define/gpt-sovits-onnx-rs", rev = "01d76cf190e04ce681b4dae6104ce1b3baee2ab7", optional = true }
# Optional: ASR (Sherpa-ONNX via sherpa-rs)
# Vendored so we can track newer sherpa-onnx C-API for newer models (e.g. FunASR-Nano).
sherpa-rs = { path = "vendor/sherpa-rs/sherpa-rs", default-features = false, features = ["download-binaries"], optional = true }
smallvec = "1.15.1"

[features]
default = []
gpt-sovits = ["dep:gpt_sovits_rs", "dep:wav_io", "tokenizer-jieba", "audio-rodio"]
gpt-sovits-onnx = ["dep:gpt_sovits_onnx_rs", "dep:ort", "audio-rodio"]
audio-rodio = ["dep:rodio"]
tokenizer-jieba = ["dep:jieba-rs"]
asr-sherpa = ["dep:sherpa-rs"]
asr-mic = ["dep:cpal"]
turn-smart = ["dep:smart-turn-rs", "dep:ort"]
tts-remote = ["dep:bytes", "dep:futures-util", "dep:reqwest", "dep:serde", "dep:serde_json", "audio-rodio"]
tts-worker = ["dep:bytes", "dep:futures-util", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:serde", "dep:serde_json", "gpt-sovits"]

[dev-dependencies]
async-openai = { version = "0.32.2", features = ["byot", "chat-completion", "native-tls"] }
serde_json = "1"
futures = "0.3"
hound = "3.5.1"
